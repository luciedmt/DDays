<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Car Data - Demo Days 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:Segoe UI, Arial, sans-serif;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 20px;
}

.container{
    max-width:450px;
    width:100%;
    text-align:center;
}

.logo{
    width:100%;
    max-width:350px;
    margin-bottom:30px;
}

h1{
    font-size:2.2rem;
    margin-bottom:12px;
}

.subtitle{
    color:#d9d9d9;
    font-size:1rem;
    margin-bottom:40px;
    line-height:1.5;
}

.btn{
    display:block;
    width:100%;
    padding:28px;
    margin-bottom:20px;
    border-radius:20px;
    text-decoration:none;
    font-size:1.8rem;
    font-weight:300;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.booking{
    background:#F5FF00;
    color:#000;
}

.quiz{
    background:#FF3131;
    color:#FFF;
}

.footer{
    margin-top:30px;
    color:#888;
    font-size:0.85rem;
}
</style>

</head>

<body>

<div class="container">

    <img src="logo-ar Data" class="logo">

    <h1>Demo Days 2026</h1>

    <p class="subtitle">
        Bienvenue sur le stand Car Data.<br>
        Réservez votre démonstration et participez à notre quiz interactif.
    </p>

    <a
        class="btn booking"
        href="https://forms.cloud.microsoft/e/uqYyECtnsN?origin=lprLink"
        target="_blank">
        Programme & Réservation
    </a>

    <a
        class="btn quiz"
        href="https://forms.cloud.microsoft/e/wuSpvGRHJZ?origin=lprLink"
        target="_blank">
        Participer au Quiz
    </a>

    <div class="footer">
        Stand Car Data • Demo Days 2026
    </div>

</div>

</body>
</html>
